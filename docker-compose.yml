services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MCP_SERVER_DLL: /app/mcp-server/McpServer.dll
      DOTNET_DiagnosticPorts: /diag/dotnet-monitor.sock
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - diagnostics:/diag
    depends_on:
      monitor:
        condition: service_started
  monitor:
    image: mcr.microsoft.com/dotnet/monitor:latest
    # Для dev: общий diagnostic volume создаётся с root-владельцем Docker.
    user: "0:0"
    command: ["collect", "--no-auth", "--urls", "http://*:52323", "--diagnostic-port", "/diag/dotnet-monitor.sock"]
    ports:
      - "${DOTNET_MONITOR_PORT:-52324}:52323"
    volumes:
      - diagnostics:/diag
      - monitor-data:/tmp

volumes:
  diagnostics:
  monitor-data:
